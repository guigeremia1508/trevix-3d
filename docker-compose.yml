services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao3d
      POSTGRES_USER: gestao3d
      POSTGRES_PASSWORD: gestao3d_dev_change_me
    volumes:
      - postgres-data:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://gestao3d:gestao3d_dev_change_me@db:5432/gestao3d
      INITIAL_ADMIN_EMAIL: admin@local.test
      INITIAL_ADMIN_PASSWORD: change-me-now
    restart: unless-stopped
volumes:
  postgres-data:
